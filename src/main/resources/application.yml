server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: auto-create-data-backend
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      # Disable browser caching of static assets so refresh always picks up
      # the latest HTML/JS/CSS. Flip to true for production.
      cache:
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

# ---- Application config ---------------------------------------------------
